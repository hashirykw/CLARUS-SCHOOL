<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Page not found · Clarus School</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<script>(function(){var t;try{t=localStorage.getItem('clarus-theme')}catch(e){}if(t!=='light'&&t!=='dark'){t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}document.documentElement.dataset.theme=t})();</script>
<link rel="stylesheet" href="/css/tokens.css">
<style>
*{box-sizing:border-box;margin:0}
body{min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:24px;background:var(--color-paper);color:var(--color-ink);font:400 16px/1.6 var(--font-sans);text-align:center}
main{display:flex;flex-direction:column;align-items:center;gap:18px;max-width:440px}
img{width:120px;height:auto}
[data-theme="dark"] img{filter:invert(1) hue-rotate(180deg) brightness(1.1)}
h1{font:600 clamp(40px,8vw,64px)/1 var(--font-serif)}
p{color:var(--color-mute)}
a{display:inline-flex;align-items:center;height:50px;padding:0 24px;margin-top:8px;border-radius:14px;background:var(--btn-bg);color:var(--btn-fg);font:600 14.5px/1 var(--font-sans);text-decoration:none}
a:focus-visible{outline:2px solid var(--color-focus);outline-offset:3px}
</style>
</head>
<body>
<main>
  <img src="/assets/clarus-mark.svg" width="120" height="103" alt="Clarus School">
  <h1>Page not found.</h1>
  <p>This page doesn't exist, or it has moved.</p>
  <a href="/">Back to Clarus School</a>
</main>
</body>
</html>
